[package]
name = "pk-desktop"
version = "0.61.0-alpha"
edition = "2021"
description = "Local PK analysis with teal and MCP"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
